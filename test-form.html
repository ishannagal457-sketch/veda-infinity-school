<!DOCTYPE html>
<html>
<head><title>Form Test</title></head>
<body style="padding:40px;font-family:sans-serif;max-width:500px;margin:auto;">

<h1>Form Test</h1>

<form action="https://formspree.io/f/mzezgqvl" method="POST">
  <p>
    <label>Your Name:</label><br>
    <input type="text" name="name" required style="width:100%;padding:10px;margin-top:5px;">
  </p>
  <p>
    <label>Your Email:</label><br>
    <input type="email" name="email" required style="width:100%;padding:10px;margin-top:5px;">
  </p>
  <p>
    <label>Message:</label><br>
    <textarea name="message" rows="4" required style="width:100%;padding:10px;margin-top:5px;"></textarea>
  </p>
  <button type="submit" style="padding:12px 24px;background:#e8841a;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;">Send</button>
</form>

</body>
</html>
